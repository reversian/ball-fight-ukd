<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Fight UKD</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #181b24;
    --line: #2a2f3d;
    --text: #e8eaf0;
    --muted: #8a90a2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { margin: 0 0 14px; font-size: 28px; letter-spacing: 1px; }
  h1 span { color: var(--muted); font-weight: 400; }
  .wrap { width: 100%; max-width: 600px; display: grid; grid-template-columns: minmax(0, 1fr); }
  .select {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .select select {
    width: 100%;
    padding: 6px 8px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
  }
  .select select:disabled { opacity: 0.5; }
  .vs { color: var(--muted); font-weight: 700; }
  .hud {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: start;
    margin-bottom: 10px;
  }
  .hp-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .hp-name small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .hp-track { height: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .hp-fill { height: 100%; width: 100%; transition: width 0.15s; }
  .right { text-align: right; }
  .right .hp-fill { margin-left: auto; }
  #timer { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; padding-top: 2px; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mute {
    width: 32px;
    height: 32px;
    padding: 0;
    font-size: 16px;
    line-height: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
    touch-action: manipulation;
  }
  canvas {
    /* 가로 화면(폰 가로 모드)에서도 경기장이 화면 높이 안에 들어오게 한다 */
    width: min(100%, max(280px, calc(100svh - 230px)));
    aspect-ratio: 1;
    margin: 0 auto;
    border: 2px solid var(--line);
    border-radius: 6px;
    background: #12151d;
    display: block;
    touch-action: manipulation;
    cursor: pointer;
  }
  .start {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 12px auto 0;
    padding: 12px;
    font-size: 17px;
    font-weight: 700;
    color: #0f1117;
    background: #f5c542;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .start:active { transform: scale(0.98); }
  .start:disabled { background: var(--panel); color: var(--muted); border: 1px solid var(--line); cursor: default; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.45; }
  .card h3 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h3 img { width: 28px; height: 28px; }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; }
  .card dd p { margin: 0 0 4px; }
  .card .cool { color: var(--muted); font-size: 12px; }
  .hint { margin-top: 14px; color: var(--muted); font-size: 13px; text-align: center; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: var(--panel); color: var(--text); }
  @media (max-width: 520px) {
    body { padding: 14px 12px; }
    h1 { font-size: 22px; margin-bottom: 10px; }
    .select, .hud { gap: 8px; }
    .hp-name { font-size: 13px; }
    .hp-name small { display: block; margin-left: 0; }
    #timer { font-size: 12px; }
    .cards { grid-template-columns: 1fr; }
    .hint { display: none; }
  }
  /* 폰 가로 모드: 경기장은 왼쪽에 화면 높이만큼, 나머지 정보는 오른쪽에 */
  @media (orientation: landscape) and (max-height: 520px) {
    body { padding: 10px 16px; }
    h1 { display: none; }
    .wrap { max-width: 1000px; grid-template-columns: auto minmax(0, 1fr); column-gap: 16px; align-items: start; }
    canvas { grid-column: 1; grid-row: 1 / span 5; width: calc(100svh - 24px); margin: 0; position: sticky; top: 10px; }
    .select, .hud, .start, .cards, .hint { grid-column: 2; }
    .start { margin: 4px 0 0; max-width: none; }
    .cards { grid-template-columns: 1fr; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <h1>Ball Fight <span>UKD</span></h1>

  <div class="wrap">
    <div class="select">
      <select id="pick0"></select>
      <div class="vs">VS</div>
      <select id="pick1"></select>
    </div>

    <div class="hud">
      <div>
        <div class="hp-name" id="name0"></div>
        <div class="hp-track"><div class="hp-fill" id="hp0"></div></div>
      </div>
      <div class="mid">
        <div id="timer">0.0s</div>
        <button class="mute" id="mute" type="button" aria-label="소리 끄기">🔊</button>
      </div>
      <div class="right">
        <div class="hp-name" id="name1"></div>
        <div class="hp-track"><div class="hp-fill" id="hp1"></div></div>
      </div>
    </div>

    <canvas id="arena"></canvas>
    <button class="start" id="start" type="button">시작</button>

    <div class="cards" id="cards"></div>
    <div class="hint">경기장 탭, 시작 버튼, 또는 <kbd>Space</kbd>로 시작</div>
  </div>

<script>
const SIZE = 600;
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
canvas.width = SIZE * dpr;
canvas.height = SIZE * dpr;
ctx.scale(dpr, dpr);

// ---------- 공통 수치 ----------

const SPEED = { '매우 빠름': 520, '빠름': 420, '보통': 320, '느림': 240, '매우 느림': 170 };
const BALL_SIZE = { '매우 큼': 62, '큼': 52, '보통': 44, '작음': 36, '매우 작음': 28 };
const KNOCKBACK_BOOST = 2;      // 넉백 직후 추가 속도 배율 (원래 속도의 1 + 2 = 3배)
const KNOCKBACK_DECAY = 2.5;    // 초당 추가 배율 감소량 (약 0.8초 후 원래 속도)

// ---------- 효과음 ----------
// 파일 없이 Web Audio로 직접 합성한다. 브라우저 정책상 첫 탭/클릭(시작) 때 켜진다.

const sound = (() => {
  let ac = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('muted') === '1'; } catch (e) {}
  const last = {};

  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.6;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }

  function envelope(g, t, vol, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function tone(freq, dur, { type = 'sine', vol = 0.2, to = 0, delay = 0 } = {}) {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    envelope(g, t, vol, dur);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function noise(dur, { freq = 1000, vol = 0.2, delay = 0 } = {}) {
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = 'bandpass';
    f.frequency.value = freq;
    envelope(g, t, vol, dur);
    src.connect(f).connect(g).connect(master);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  const SFX = {
    wall: () => tone(260, 0.05, { type: 'triangle', vol: 0.05 }),
    bump: () => { noise(0.08, { freq: 400, vol: 0.25 }); tone(140, 0.12, { to: 70, vol: 0.2 }); },
    hit: () => noise(0.06, { freq: 1500, vol: 0.15 }),
    start: () => { tone(523, 0.1, { type: 'square', vol: 0.06 }); tone(784, 0.2, { type: 'square', vol: 0.06, delay: 0.1 }); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.6 : 0.15, { type: 'square', vol: 0.07, delay: i * 0.12 })),
    draw: () => { tone(392, 0.3, { type: 'triangle', vol: 0.12 }); tone(370, 0.5, { type: 'triangle', vol: 0.12, delay: 0.3 }); },
    // 고준형
    coin: () => { tone(988, 0.08, { type: 'square', vol: 0.06 }); tone(1319, 0.3, { type: 'square', vol: 0.06, delay: 0.08 }); },
    coinTick: () => tone(1568, 0.07, { type: 'triangle', vol: 0.06 }),
    absorb: () => tone(300, 0.25, { to: 900, type: 'sawtooth', vol: 0.05 }),
    down: () => tone(400, 0.45, { to: 100, type: 'sawtooth', vol: 0.08 }),
    revive: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.35, { type: 'triangle', vol: 0.12, delay: i * 0.07 })),
    // 허현
    cheek: () => { noise(0.1, { freq: 300, vol: 0.3 }); tone(180, 0.18, { to: 60, type: 'square', vol: 0.1 }); },
    block: () => tone(1200, 0.08, { type: 'triangle', vol: 0.08 }),
    ukka: () => { tone(110, 0.3, { type: 'sawtooth', vol: 0.08 }); tone(117, 0.3, { type: 'sawtooth', vol: 0.08 }); },
    // 박건
    domain: () => { tone(120, 0.6, { to: 240, vol: 0.12 }); noise(0.6, { freq: 600, vol: 0.05 }); },
    domainHit: info => {
      const f = 200 + (info.step || 1) * 80;
      tone(f, 0.3, { to: f / 2, type: 'square', vol: 0.06 + (info.step || 1) * 0.02 });
      noise(0.2, { freq: 500, vol: 0.2 });
    },
    // 이민규
    snotFire: () => tone(600, 0.08, { to: 200, vol: 0.15 }),
    snotHit: () => { noise(0.15, { freq: 250, vol: 0.3 }); tone(250, 0.12, { to: 120, type: 'triangle', vol: 0.12 }); },
    // 양서지
    alpha: () => { noise(0.12, { freq: 800, vol: 0.3 }); tone(330, 0.2, { to: 110, type: 'sawtooth', vol: 0.1 }); },
    // 함태준
    colosseum: () => { noise(0.8, { freq: 150, vol: 0.3 }); tone(80, 0.8, { to: 50, type: 'square', vol: 0.08 }); },
    wallHit: () => { noise(0.07, { freq: 200, vol: 0.25 }); tone(90, 0.08, { type: 'square', vol: 0.06 }); },
    tackle: () => { noise(0.1, { freq: 600, vol: 0.25 }); tone(220, 0.15, { to: 90, type: 'square', vol: 0.08 }); },
  };

  function play(name, info = {}) {
    if (!ac || muted || !SFX[name]) return;
    // 같은 소리가 한 순간에 몰려 시끄러워지지 않게 한다
    const now = ac.currentTime;
    if (last[name] && now - last[name] < 0.04) return;
    last[name] = now;
    SFX[name](info);
  }

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('muted', muted ? '1' : '0'); } catch (e) {}
    return muted;
  }

  return { unlock, play, toggleMute, isMuted: () => muted };
})();

const IMAGES = {};
function loadImage(src) {
  if (!IMAGES[src]) {
    const img = new Image();
    img.src = src;
    IMAGES[src] = img;
  }
  return IMAGES[src];
}

// ---------- 캐릭터 ----------
// 새 캐릭터는 이 배열에 추가한다.
// 훅: init(self) / update(self, other, dt) / onContact(self, other, n)  n = self→other 방향 단위벡터
//     modifyIncoming(self, dmg, info) → 받는 피해 보정 / onLethal(self) → true면 쓰러짐을 막음
//     drawUnder(self) → 공보다 아래에 그릴 효과 (배경 영역 등)
//     onWall(self) → 자신이 벽에 닿았을 때 / onEnemyWall(self, enemy) → 상대가 벽에 닿았을 때

const COIN_TICK = 1;    // 코인 표식 피해 간격 (초)
const COIN_DAMAGE = 4;  // 코인 표식 1회 피해량
const COIN_HEAL = 1;    // 코인 표식이 피해를 줄 때마다 고준형이 회복하는 HP
const COIN_RECOVER_DELAY = 3; // 표식이 붙고 이 시간이 지나야 회수(스킬 2) 가능

const DOMAIN_IMAGE = 'images/balls/박건배경영역.jpg';
const DOMAIN_GROW_SPEED = 160; // 배경 반지름이 초당 커지는 양 (px)
const DOMAIN_STEP = 80;        // 배경이 이만큼 커질 때마다 피해 한 단계 증가 (0.5초)
const DOMAIN_DAMAGE_STEP = 8;  // 단계당 피해 (8, 16, 24, 32, 40)
const DOMAIN_MAX_STEPS = 5;

const COLOSSEUM_IMAGE = 'images/balls/함태준콜로세움.jpg';
const COLOSSEUM_DELAY = 3;       // 함태준: 게임 시작 3초 후부터 콜로세움 적용
const COLOSSEUM_WALL_DAMAGE = 2; // 상대가 벽에 닿을 때마다 주는 피해
const COLOSSEUM_WALL_WIDTH = 10; // 벽돌 벽 두께 (px)

const ALPHA_DAMAGE_STEP = 2;      // 양서지: 부딪힐 때마다 늘어나는 피해 (0 → 2 → 4 …)
const ALPHA_KNOCKBACK_BOOST = 2;  // 양서지 넉백: 원래 속도의 1 + 2 = 3배

const SNOT_IMAGE = 'images/balls/이민규투사체.png';
const SNOT_SPEED = SPEED['보통'];
const SNOT_RADIUS = 14;
const SNOT_DAMAGE = 18;
const SNOT_MAX_WALL_HITS = 3; // 벽에 2번 튕기고 3번째로 부딪히면 사라진다
const SLOW_DURATION = 1;      // 코딱지에 맞으면 1초 동안
const SLOW_FACTOR = 0.5;      // 원래 속도의 절반으로 느려진다

const CHARACTERS = [
  {
    name: '고준형', hp: 100, speed: '보통', size: '보통', color: '#f5c542',
    image: 'images/balls/고준형.png',
    ability: '경제론',
    skills: [
      {
        name: '호텔 경제론', cooldown: 0,
        desc: `적과 접촉 시 자신의 HP를 5 잃고 적의 HP를 5 회복시키며 적에게 ‘코인 표식’을 남긴다. 코인 표식이 붙은 적은 ${COIN_TICK}초마다 ${COIN_DAMAGE}의 피해를 받고, 그때마다 고준형은 HP를 ${COIN_HEAL} 회복한다.`,
      },
      {
        name: '결론적으로 시장에 경제가 돌았잖아요?', cooldown: 0,
        desc: `코인 표식이 붙은 지 ${COIN_RECOVER_DELAY}초가 지난 적과 접촉하면 표식을 회수하고 적의 HP를 5 흡수한다. ${COIN_RECOVER_DELAY}초가 안 됐으면 아무 일도 일어나지 않는다.`,
      },
    ],
    trait: {
      name: '불교 추천',
      desc: 'HP가 0이 되면 0.5초 후 HP 108로 단 한 번 부활하고, 모든 공격 수치가 1 증가한다.',
    },
    init(self) {
      self.atkBonus = 0;
      self.revived = false;
    },
    update(self, other, dt) {
      const mark = other.coinMark;
      if (!mark || mark.owner !== self) return;
      mark.timer += dt;
      mark.age += dt;
      while (mark.timer >= COIN_TICK && other.coinMark) {
        mark.timer -= COIN_TICK;
        const dealt = dealDamage(self, other, COIN_DAMAGE + self.atkBonus, { source: 'coinMark', sound: 'coinTick', color: '#f5c542' });
        if (dealt > 0) heal(self, COIN_HEAL);
      }
    },
    onContact(self, other, n) {
      if (other.coinMark && other.coinMark.owner === self) {
        if (other.coinMark.age < COIN_RECOVER_DELAY) return;
        other.coinMark = null;
        const dealt = dealDamage(self, other, 5 + self.atkBonus, { contact: n, sound: 'absorb', color: '#f5c542' });
        heal(self, dealt);
      } else {
        loseHp(self, 5);
        heal(other, 5);
        other.coinMark = { owner: self, timer: 0, age: 0 };
        sound.play('coin');
      }
    },
    onLethal(self) {
      if (self.revived) return false;
      self.revived = true;
      self.reviving = 0.5;
      sound.play('down');
      self.hp = 0;
      return true;
    },
    onRevive(self) {
      self.hp = self.maxHp = 108;
      self.atkBonus = 1;
      self.img = loadImage('images/balls/고준형부활.png');
      sound.play('revive');
    },
  },
  {
    name: '허현', hp: 210, speed: '보통', size: '보통', color: '#ff4d5e',
    image: 'images/balls/허현.png',
    ability: '광대뼈 돌출',
    cheekAngle: 35, // 좌우 수평선에서 ±35° 범위가 광대뼈
    skills: [
      {
        name: '광대뼈 돌출', cooldown: 0,
        desc: '자신의 왼쪽·오른쪽(광대뼈)에 접촉한 적에게 35의 피해를 주고 강하게 넉백시킨다. 광대뼈 부분으로 공격받으면 받는 피해가 절반이 된다. 단, 코인 표식 피해는 절반이 되지 않는다.',
      },
    ],
    trait: {
      name: '억까',
      desc: '상대의 공격을 맞을 때 1/7 확률로 2배의 피해를 받는다.',
    },
    onContact(self, other, n) {
      if (!isCheek(self, n)) return;
      dealDamage(self, other, 35, { contact: n, sound: 'cheek', color: '#ff4d5e' });
      knockback(other, n);
    },
    modifyIncoming(self, dmg, info) {
      // info.contact는 공격자→self 방향이므로 뒤집어서 self 기준으로 본다
      // 코인 표식 피해는 광대뼈로 줄일 수 없다
      if (info.contact && info.source !== 'coinMark' && isCheek(self, { x: -info.contact.x, y: -info.contact.y })) {
        dmg /= 2;
        sound.play('block');
      }
      if (Math.random() < 1 / 7) {
        dmg *= 2;
        sound.play('ukka');
      }
      return dmg;
    },
  },
  {
    name: '박건', hp: 190, speed: '보통', size: '보통', color: '#9b7bff',
    image: 'images/balls/박건.png',
    ability: '지배자',
    skills: [
      {
        name: '권한 행사', cooldown: 4.5,
        desc: '쿨타임이 끝나면 자신을 중심으로 넓어지는 배경을 소환한다. 배경은 박건을 따라다니며 상대와 닿을 때까지 커지고, 닿으면 사라진다. 사라진 때부터 쿨타임이 다시 돈다.',
      },
    ],

      }

      ctx.fillRect(0, SIZE - w, SIZE, w);

function isCheek(ball, n) {
  const limit = Math.sin((ball.def.cheekAngle * Math.PI) / 180);
  return Math.abs(n.y) < limit;
}

// ---------- 게임 상태 ----------

let picks = [0, 1];
let balls = [];
let texts = [];
let state = 'ready'; // ready | running | over
let elapsed = 0;
let winner = null;
let lastTime = 0;
let projectiles = [];
let touching = false; // 두 공이 맞닿아 있는 동안 접촉 스킬이 매 프레임 반복 발동하지 않게 한다
let fontScale = 1; // 화면이 작아 캔버스가 축소되면 글자를 키워 읽을 수 있게 한다

function px(size) { return `${Math.round(size * fontScale)}px`; }

function makeBall(def, side) {
  const radius = BALL_SIZE[def.size];
  const speed = SPEED[def.speed];
  const angle = Math.random() * Math.PI * 2;
  const ball = {
    def, side, radius, speed,
    hp: def.hp,
    maxHp: def.hp,
    x: side === 0 ? SIZE * 0.25 : SIZE * 0.75,
    y: radius + Math.random() * (SIZE - radius * 2),
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    // 게임 시작 시에도 쿨타임이 적용된다
    cd: def.skills.map(s => s.cooldown),
    img: loadImage(def.image),
    boost: 0,
    flash: 0,
    reviving: 0,
    slow: 0,
    coinMark: null,
  };
  if (def.init) def.init(ball);
  return ball;
}

function reset() {
  balls = picks.map((p, side) => makeBall(CHARACTERS[p], side));
  texts = [];
  elapsed = 0;
  winner = null;
  touching = false;
  projectiles = [];
}

// ---------- 피해 / 회복 ----------

function checkLethal(ball) {
  if (ball.hp > 0 || ball.reviving > 0) return;
  if (ball.def.onLethal) ball.def.onLethal(ball);
}

// 상대의 공격. 실제로 들어간 피해량을 돌려준다
function dealDamage(attacker, target, amount, info = {}) {
  if (target.reviving > 0) return 0;
  let dmg = amount;
  if (target.def.modifyIncoming) dmg = target.def.modifyIncoming(target, dmg, info);
  if (dmg <= 0) return 0;
  target.hp -= dmg;
  target.flash = 0.15;
  sound.play(info.sound || 'hit', info);
  texts.push({
    x: target.x + (Math.random() - 0.5) * 24, y: target.y - 6,
    text: `-${+dmg.toFixed(1)}`, color: info.color || attacker.def.color, life: 0.9,
  });
  checkLethal(target);
  return dmg;
}

// 공격이 아닌 스스로의 HP 소모
function loseHp(ball, amount) {
  if (ball.reviving > 0) return;
  ball.hp -= amount;
  checkLethal(ball);
}

function heal(ball, amount) {
  if (ball.reviving > 0 || amount <= 0) return;
  ball.hp = Math.min(ball.maxHp, ball.hp + amount);
  texts.push({ x: ball.x, y: ball.y + 10, text: `+${+amount.toFixed(1)}`, color: '#6be38a', life: 0.9 });
}

// ---------- 이동 / 충돌 ----------

function setDirection(ball, dx, dy) {
  // 방향만 바꾸고 각 공의 고유 속도는 유지, 같은 경로를 반복하지 않도록 약간 흔든다
  const jitter = (Math.random() - 0.5) * 0.3;
  const angle = Math.atan2(dy, dx) + jitter;
  ball.vx = Math.cos(angle) * ball.speed;
  ball.vy = Math.sin(angle) * ball.speed;
}

function knockback(ball, n, boost = KNOCKBACK_BOOST) {
  setDirection(ball, n.x, n.y);
  ball.boost = boost;
}

function collideWalls(b) {
  let bounced = true;
  if (b.x - b.radius < 0) { b.x = b.radius; setDirection(b, Math.abs(b.vx), b.vy); }
  else if (b.x + b.radius > SIZE) { b.x = SIZE - b.radius; setDirection(b, -Math.abs(b.vx), b.vy); }
  else bounced = false;
  if (b.y - b.radius < 0) { b.y = b.radius; setDirection(b, b.vx, Math.abs(b.vy)); bounced = true; }
  else if (b.y + b.radius > SIZE) { b.y = SIZE - b.radius; setDirection(b, b.vx, -Math.abs(b.vy)); bounced = true; }
  if (bounced) sound.play('wall');
  return bounced;
}

function collideBalls(a, b) {
  if (a.reviving > 0 || b.reviving > 0) return;
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.hypot(dx, dy);
  const minDist = a.radius + b.radius;
  if (dist >= minDist + 1) touching = false;
  if (dist >= minDist || dist === 0) return;

  const nx = dx / dist, ny = dy / dist;
  const overlap = minDist - dist;
  a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
  b.x += nx * overlap / 2; b.y += ny * overlap / 2;

  // 법선 방향 성분을 반사해 서로 멀어지게 한다
  const an = a.vx * nx + a.vy * ny;
  const bn = b.vx * nx + b.vy * ny;
  setDirection(a, a.vx - (an > 0 ? 2 * an * nx : 0) - nx * a.speed * 0.5,
                  a.vy - (an > 0 ? 2 * an * ny : 0) - ny * a.speed * 0.5);
  setDirection(b, b.vx - (bn < 0 ? 2 * bn * nx : 0) + nx * b.speed * 0.5,
                  b.vy - (bn < 0 ? 2 * bn * ny : 0) + ny * b.speed * 0.5);

  if (touching) return;
  touching = true;
  sound.play('bump');
  const n = { x: nx, y: ny };
  if (a.def.onContact) a.def.onContact(a, b, n);
  if (b.def.onContact) b.def.onContact(b, a, { x: -nx, y: -ny });
}

function updateProjectiles(dt) {
  projectiles = projectiles.filter(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    let hitWall = false;
    if (p.x - p.r < 0) { p.x = p.r; p.vx = Math.abs(p.vx); hitWall = true; }
    if (p.x + p.r > SIZE) { p.x = SIZE - p.r; p.vx = -Math.abs(p.vx); hitWall = true; }
    if (p.y - p.r < 0) { p.y = p.r; p.vy = Math.abs(p.vy); hitWall = true; }
    if (p.y + p.r > SIZE) { p.y = SIZE - p.r; p.vy = -Math.abs(p.vy); hitWall = true; }
    if (hitWall && ++p.wallHits >= SNOT_MAX_WALL_HITS) return false;

    // 부활 대기 중인 상대는 그냥 통과한다
    const target = balls.find(b => b !== p.owner && b.reviving <= 0);
    if (!target) return true;
    const dx = target.x - p.x, dy = target.y - p.y;
    const dist = Math.hypot(dx, dy);
    if (dist >= p.r + target.radius) return true;
    p.onHit(target, { x: dx / (dist || 1), y: dy / (dist || 1) });
    return false;
  });
}

function update(dt) {
  elapsed += dt;
  balls.forEach(b => {
    b.cd = b.cd.map(c => Math.max(0, c - dt));
    b.flash = Math.max(0, b.flash - dt);

    if (b.reviving > 0) {
      b.reviving -= dt;
      if (b.reviving <= 0) { b.reviving = 0; b.def.onRevive(b); }
    } else {
      const mult = (1 + b.boost) * (b.slow > 0 ? SLOW_FACTOR : 1);
      b.boost = Math.max(0, b.boost - KNOCKBACK_DECAY * dt);
      b.slow = Math.max(0, b.slow - dt);
      b.x += b.vx * mult * dt;
      b.y += b.vy * mult * dt;
      if (collideWalls(b)) {
        const other = balls.find(o => o !== b);
        if (b.def.onWall) b.def.onWall(b);
        if (other.def.onEnemyWall) other.def.onEnemyWall(other, b);
      }
    }
  });
  // 두 공이 모두 움직인 뒤에 스킬을 처리해야 먼저 처리되는 쪽이 유리해지지 않는다
  balls.forEach((b, i) => {
    if (b.def.update) b.def.update(b, balls[1 - i], dt);
  });
  updateProjectiles(dt);
  collideBalls(balls[0], balls[1]);

  const down = balls.filter(b => b.hp <= 0 && b.reviving <= 0);
  if (down.length) {
    state = 'over';
    // 동시에 쓰러지면 체력이 덜 깎인(초과 피해가 적은) 쪽이 승리
    const [a, b] = balls;
    winner = down.length === 1 ? balls.find(x => !down.includes(x))
           : a.hp === b.hp ? null : (a.hp > b.hp ? a : b);
    for (const ball of balls) { ball.hp = Math.max(0, ball.hp); ball.flash = 0; }
    setPickersEnabled(true);
    sound.play(winner ? 'win' : 'draw');
  }
}

function updateTexts(dt) {
  for (const t of texts) { t.life -= dt; t.y -= 40 * dt; }
  texts = texts.filter(t => t.life > 0);
}

// ---------- 렌더링 ----------

function drawArena() {
  ctx.fillStyle = '#12151d';
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.strokeStyle = '#1b1f2a';
  ctx.lineWidth = 1;
  for (let i = 50; i < SIZE; i += 50) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, SIZE); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(SIZE, i); ctx.stroke();
  }
}

function drawBall(b) {
  const { x, y, radius: r } = b;
  ctx.save();
  if (b.reviving > 0) ctx.globalAlpha = 0.35 + 0.35 * Math.sin(elapsed * 40);

  ctx.shadowColor = b.def.color;
  ctx.shadowBlur = 18;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = b.def.color;
  ctx.fill();
  ctx.shadowBlur = 0;

  if (b.img.complete && b.img.naturalWidth) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r - 2, 0, Math.PI * 2);
    ctx.clip();
    ctx.drawImage(b.img, x - r + 2, y - r + 2, (r - 2) * 2, (r - 2) * 2);
    ctx.restore();
  }

  if (b.flash > 0) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.fill();
  }

  if (b.slow > 0) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(124, 207, 90, 0.35)';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(x, y, r - 1, 0, Math.PI * 2);
  ctx.strokeStyle = b.def.color;
  ctx.lineWidth = 3;
  ctx.stroke();

  // 광대뼈 영역 표시 (스킬 준비 시 밝게)
  if (b.def.cheekAngle) {
    const a = (b.def.cheekAngle * Math.PI) / 180;
    ctx.strokeStyle = b.cd[0] <= 0 ? '#ffd0d5' : 'rgba(255, 208, 213, 0.35)';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y, r + 4, -a, a); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r + 4, Math.PI - a, Math.PI + a); ctx.stroke();
  }
  ctx.restore();

  if (b.coinMark) {
    const coin = loadImage('images/balls/고준형코인표식.png');
    const cr = r * 0.42;
    const ang = elapsed * 3;
    const cx = x + Math.cos(ang) * r * 0.85;
    const cy = y + Math.sin(ang) * r * 0.85;
    if (coin.complete && coin.naturalWidth) {
      ctx.save();
      ctx.shadowColor = '#f5c542';
      ctx.shadowBlur = 12;
      ctx.drawImage(coin, cx - cr, cy - cr, cr * 2, cr * 2);
      ctx.restore();
    }
  }

  ctx.fillStyle = 'rgba(10, 12, 18, 0.75)';
  const label = `${Math.ceil(Math.max(0, b.hp))}`;
  ctx.font = `bold ${px(12)} sans-serif`;
  const w = ctx.measureText(label).width + 10;
  const h = 16 * fontScale;
  // roundRect는 구형 iOS Safari에 없어서 직접 그린다
  ctx.beginPath();
  ctx.arc(x - w / 2 + h / 2, y + r - 2, h / 2, Math.PI / 2, Math.PI * 1.5);
  ctx.arc(x + w / 2 - h / 2, y + r - 2, h / 2, -Math.PI / 2, Math.PI / 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y + r - 2);
}

function drawProjectiles() {
  for (const p of projectiles) {
    const img = loadImage(p.img);
    if (img.complete && img.naturalWidth) {
      ctx.drawImage(img, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.owner.def.color;
      ctx.fill();
    }
  }
}

function drawTexts() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life));
    ctx.font = `bold ${px(15)} sans-serif`;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(10, 12, 18, 0.8)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawOverlay(title, sub, color) {
  ctx.fillStyle = 'rgba(10, 12, 18, 0.7)';
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#e8eaf0';
  ctx.font = `bold ${px(40)} sans-serif`;
  ctx.fillText(title, SIZE / 2, SIZE / 2 - 16 * fontScale);
  ctx.fillStyle = '#8a90a2';
  ctx.font = px(18) + ' sans-serif';
  ctx.fillText(sub, SIZE / 2, SIZE / 2 + 30 * fontScale);
}

function render() {
  fontScale = Math.min(1.8, Math.max(1, SIZE / (canvas.clientWidth || SIZE)));
  drawArena();
  balls.forEach(b => b.def.drawUnder && b.def.drawUnder(b));
  balls.forEach(drawBall);
  drawProjectiles();
  drawTexts();

  if (state === 'ready') {
    drawOverlay('Ball Fight UKD', '탭하거나 시작 버튼을 눌러 시작');
  } else if (state === 'over') {
    if (winner) drawOverlay(`${winner.def.name} 승리!`, `${elapsed.toFixed(1)}초 · 탭해서 다시 시작`, winner.def.color);
    else drawOverlay('무승부!', '탭해서 다시 시작');
  }

  balls.forEach((b, i) => {
    const fill = document.getElementById(`hp${i}`);
    fill.style.width = `${(Math.max(0, b.hp) / b.maxHp) * 100}%`;
    fill.style.background = b.def.color;
    document.getElementById(`name${i}`).innerHTML =
      `${b.def.name}<small>${Math.ceil(Math.max(0, b.hp))} / ${b.maxHp}</small>`;
  });
  document.getElementById('timer').textContent = `${elapsed.toFixed(1)}s`;

  const label = { ready: '시작', running: '경기 중…', over: '다시 시작' }[state];
  if (startBtn.textContent !== label) startBtn.textContent = label;
  startBtn.disabled = state === 'running';
}

function renderCards() {
  document.getElementById('cards').innerHTML = picks.map(p => {
    const d = CHARACTERS[p];
    return `
    <div class="card">
      <h3 style="color:${d.color}"><img src="${d.image}" alt="">${d.name}</h3>
      <dl>
        <dt>HP</dt><dd>${d.hp}</dd>
        <dt>속도</dt><dd>${d.speed}</dd>
        <dt>크기</dt><dd>${d.size}</dd>
        <dt>능력</dt><dd>${d.ability}</dd>
        <dt>스킬</dt><dd>${d.skills.map(s => `
          <p><b>${s.name}</b> <span class="cool">${s.cooldown ? `쿨타임 ${s.cooldown}초` : '조건 발동'}</span><br>${s.desc}</p>`).join('')}
        </dd>
        <dt>특성</dt><dd><b>${d.trait.name}</b> — ${d.trait.desc}</dd>
      </dl>
    </div>`;
  }).join('');
}

// ---------- 캐릭터 선택 ----------

function setPickersEnabled(on) {
  [0, 1].forEach(i => { document.getElementById(`pick${i}`).disabled = !on; });
}

[0, 1].forEach(i => {
  const sel = document.getElementById(`pick${i}`);
  sel.innerHTML = CHARACTERS.map((c, k) => `<option value="${k}">${c.name}</option>`).join('');
  sel.value = picks[i];
  sel.addEventListener('change', () => {
    picks[i] = +sel.value;
    sel.blur();
    state = 'ready';
    reset();
    renderCards();
  });
});

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 1 / 30);
  lastTime = now;
  if (state === 'running') update(dt);
  updateTexts(dt);
  render();
  requestAnimationFrame(loop);
}

function startGame() {
  sound.unlock();
  if (state === 'running') return;
  if (state === 'over') reset();
  state = 'running';
  setPickersEnabled(false);
  sound.play('start');
}

const muteBtn = document.getElementById('mute');
function renderMute() {
  const muted = sound.isMuted();
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
}
muteBtn.addEventListener('click', () => {
  sound.unlock();
  sound.toggleMute();
  renderMute();
  muteBtn.blur();
});
renderMute();

const startBtn = document.getElementById('start');
startBtn.addEventListener('click', startGame);
canvas.addEventListener('pointerdown', startGame);
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  startGame();
});

reset();
renderCards();
requestAnimationFrame(now => { lastTime = now; loop(now); });
</script>
</body>
</html>
