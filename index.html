<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ball Fight UKD</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #181b24;
    --line: #2a2f3d;
    --text: #e8eaf0;
    --muted: #8a90a2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 { margin: 0 0 14px; font-size: 28px; letter-spacing: 1px; }
  h1 span { color: var(--muted); font-weight: 400; }
  .wrap { width: 100%; max-width: 600px; display: grid; grid-template-columns: minmax(0, 1fr); }
  .select {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: center;
    margin-bottom: 12px;
    font-size: 14px;
  }
  .select select {
    width: 100%;
    padding: 6px 8px;
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 14px;
  }
  .select select:disabled { opacity: 0.5; }
  .character-picker { position: relative; min-width: 0; }
  .character-picker select { display: none; }
  .picker-toggle { width: 100%; padding: 10px 8px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: inherit; }
  .picker-toggle:disabled { opacity: .5; cursor: default; }
  .picker-options { position: absolute; top: calc(100% + 5px); left: 0; width: max(100%, 360px); max-width: calc(100vw - 32px); max-height: 320px; overflow-y: auto; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; z-index: 20; box-shadow: 0 8px 24px #0008; }
  .picker-options[hidden] { display: none; }
  .character-picker:last-child .picker-options { left: auto; right: 0; }
  .picker-options button { padding: 9px 5px; color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 5px; cursor: pointer; font: inherit; font-size: 13px; }
  .picker-options button[aria-pressed="true"] { background: #35445d; border-color: #8aafff; }
  .vs { color: var(--muted); font-weight: 700; }
  .hud {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 12px;
    align-items: start;
    margin-bottom: 10px;
  }
  .hp-name { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
  .hp-name small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .hp-track { height: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .hp-fill { height: 100%; width: 100%; transition: width 0.15s; }
  .right { text-align: right; }
  .right .hp-fill { margin-left: auto; }
  #timer { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; padding-top: 2px; }
  .mid { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mute {
    width: 32px;
    height: 32px;
    padding: 0;
    font-size: 16px;
    line-height: 1;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 50%;
    cursor: pointer;
    touch-action: manipulation;
  }
  canvas {
    /* 가로 화면(폰 가로 모드)에서도 경기장이 화면 높이 안에 들어오게 한다 */
    width: min(100%, max(280px, calc(100svh - 230px)));
    aspect-ratio: 1;
    margin: 0 auto;
    border: 2px solid var(--line);
    border-radius: 6px;
    background: #12151d;
    display: block;
    touch-action: manipulation;
    cursor: pointer;
  }
  .start {
    display: block;
    width: 100%;
    max-width: 320px;
    margin: 12px auto 0;
    padding: 12px;
    font-size: 17px;
    font-weight: 700;
    color: #0f1117;
    background: #f5c542;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .start:active { transform: scale(0.98); }
  .game-controls { display:flex; gap:10px; max-width:320px; width:100%; margin:12px auto 0; }
  .game-controls .start { flex:1; min-width:0; margin:0; }
  .game-controls [hidden] { display:none; }
  #stop { background:#c86666; color:#fff; }
  .start:disabled { background: var(--panel); color: var(--muted); border: 1px solid var(--line); cursor: default; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.45; }
  .card h3 { margin: 0 0 8px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h3 img { width: 28px; height: 28px; }
  .card dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; }
  .card dt { color: var(--muted); }
  .card dd { margin: 0; }
  .card dd p { margin: 0 0 4px; }
  .card .cool { color: var(--muted); font-size: 12px; }
  .hint { margin-top: 14px; color: var(--muted); font-size: 13px; text-align: center; }
  kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: var(--panel); color: var(--text); }
  @media (max-width: 520px) {
    body { padding: 14px 12px; }
    h1 { font-size: 22px; margin-bottom: 10px; }
    .select, .hud { gap: 8px; }
    .hp-name { font-size: 13px; }
    .hp-name small { display: block; margin-left: 0; }
    #timer { font-size: 12px; }
    .cards { grid-template-columns: 1fr; }
    .hint { display: none; }
  }
  /* 폰 가로 모드: 경기장은 왼쪽에 화면 높이만큼, 나머지 정보는 오른쪽에 */
  @media (orientation: landscape) and (max-height: 520px) {
    body { padding: 10px 16px; }
    h1 { display: none; }
    .wrap { max-width: 1000px; grid-template-columns: auto minmax(0, 1fr); column-gap: 16px; align-items: start; }
    canvas { grid-column: 1; grid-row: 1 / span 5; width: calc(100svh - 24px); margin: 0; position: sticky; top: 10px; }
    .select, .hud, .start, .game-controls, .cards, .hint { grid-column: 2; }
    .start { margin: 4px 0 0; max-width: none; }
    .cards { grid-template-columns: 1fr; }
    .hint { display: none; }
  }
</style>
</head>
<body>
  <h1>Ball Fight <span>UKD</span></h1>

  <div class="wrap">
    <div class="select">
      <div class="character-picker"><select id="pick0"></select><button class="picker-toggle" id="pickerToggle0" type="button" aria-expanded="false" aria-controls="pickerOptions0"></button><div class="picker-options" id="pickerOptions0" hidden></div></div>
      <div class="vs">VS</div>
      <div class="character-picker"><select id="pick1"></select><button class="picker-toggle" id="pickerToggle1" type="button" aria-expanded="false" aria-controls="pickerOptions1"></button><div class="picker-options" id="pickerOptions1" hidden></div></div>
    </div>

    <div class="hud">
      <div>
        <div class="hp-name" id="name0"></div>
        <div class="hp-track"><div class="hp-fill" id="hp0"></div></div>
      </div>
      <div class="mid">
        <div id="timer">0.0s</div>
        <button class="mute" id="mute" type="button" aria-label="소리 끄기">🔊</button>
      </div>
      <div class="right">
        <div class="hp-name" id="name1"></div>
        <div class="hp-track"><div class="hp-fill" id="hp1"></div></div>
      </div>
    </div>

    <canvas id="arena"></canvas>
    <div class="game-controls"><button class="start" id="start" type="button">시작</button><button class="start" id="stop" type="button" hidden>종료</button></div>

    <div class="cards" id="cards"></div>
    <div class="hint">경기장 탭, 시작 버튼, 또는 <kbd>Space</kbd>로 시작</div>
  </div>

<script>
const SIZE = 600;
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
const dpr = window.devicePixelRatio || 1;
canvas.width = SIZE * dpr;
canvas.height = SIZE * dpr;
ctx.scale(dpr, dpr);

// ---------- 공통 수치 ----------

const SPEED = { '매우 빠름': 520, '빠름': 420, '보통': 320, '느림': 240, '매우 느림': 170 };
const BALL_SIZE = { '매우 큼': 62, '큼': 52, '보통': 44, '작음': 36, '매우 작음': 28 };
const KNOCKBACK_BOOST = 2;      // 넉백 직후 추가 속도 배율 (원래 속도의 1 + 2 = 3배)
const KNOCKBACK_DECAY = 2.5;    // 초당 추가 배율 감소량 (약 0.8초 후 원래 속도)

// ---------- 효과음 ----------
// 파일 없이 Web Audio로 직접 합성한다. 브라우저 정책상 첫 탭/클릭(시작) 때 켜진다.

const sound = (() => {
  let ac = null, master = null, noiseBuf = null;
  let muted = false;
  try { muted = localStorage.getItem('muted') === '1'; } catch (e) {}
  const last = {};

  function unlock() {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      master = ac.createGain();
      master.gain.value = 0.6;
      master.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const data = noiseBuf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  }

  function envelope(g, t, vol, dur) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  }

  function tone(freq, dur, { type = 'sine', vol = 0.2, to = 0, delay = 0 } = {}) {
    const t = ac.currentTime + delay;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    envelope(g, t, vol, dur);
    o.connect(g).connect(master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  function noise(dur, { freq = 1000, vol = 0.2, delay = 0 } = {}) {
    const t = ac.currentTime + delay;
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = noiseBuf;
    f.type = 'bandpass';
    f.frequency.value = freq;
    envelope(g, t, vol, dur);
    src.connect(f).connect(g).connect(master);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  const SFX = {
    paintSpill: () => {
      noise(0.07, { freq: 650, vol: 0.13 });
      tone(290, 0.18, { type: 'triangle', to: 140, vol: 0.11 });
      tone(470, 0.12, { type: 'triangle', to: 260, vol: 0.07, delay: 0.07 });
      noise(0.3, { freq: 1150, vol: 0.09, delay: 0.06 });
      noise(0.18, { freq: 420, vol: 0.07, delay: 0.13 });
    },
    quakeJump: () => {
      noise(0.3, { freq: 700, vol: 0.10 });
      tone(110, 0.42, { type: 'triangle', to: 420, vol: 0.12 });
      tone(180, 0.24, { to: 650, vol: 0.06, delay: 0.05 });
    },
    quakeLanding: () => {
      tone(95, 0.95, { to: 28, vol: 0.25 });
      tone(55, 1.25, { to: 24, vol: 0.18 });
      noise(0.24, { freq: 180, vol: 0.25 });
      noise(0.75, { freq: 85, vol: 0.15, delay: 0.08 });
      [0.12, 0.26, 0.43].forEach((delay, i) => tone(65 - i * 8, 0.5, { to: 25, vol: 0.10 / (i + 1), delay }));
    },
    pianoNote: () => tone(440 + Math.random() * 220, 0.22, { type: 'triangle', vol: 0.1 }),
    bassNote: () => { tone(82, 0.4, { type: 'sawtooth', to: 55, vol: 0.12 }); noise(0.12, { freq: 180, vol: 0.1 }); },
    wall: () => tone(260, 0.05, { type: 'triangle', vol: 0.05 }),
    bump: () => { noise(0.08, { freq: 400, vol: 0.25 }); tone(140, 0.12, { to: 70, vol: 0.2 }); },
    hit: () => noise(0.06, { freq: 1500, vol: 0.15 }),
    chew: () => {
      noise(0.075, { freq: 650 + Math.random() * 250, vol: 0.10 });
      tone(180 + Math.random() * 45, 0.09, { to: 90, type: 'sine', vol: 0.10 });
      noise(0.045, { freq: 1200, vol: 0.055, delay: 0.07 });
    },
    start: () => { tone(523, 0.1, { type: 'square', vol: 0.06 }); tone(784, 0.2, { type: 'square', vol: 0.06, delay: 0.1 }); },
    win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? 0.6 : 0.15, { type: 'square', vol: 0.07, delay: i * 0.12 })),
    draw: () => { tone(392, 0.3, { type: 'triangle', vol: 0.12 }); tone(370, 0.5, { type: 'triangle', vol: 0.12, delay: 0.3 }); },
    // 고준형
    coin: () => { tone(988, 0.08, { type: 'square', vol: 0.06 }); tone(1319, 0.3, { type: 'square', vol: 0.06, delay: 0.08 }); },
    coinTick: () => tone(1568, 0.07, { type: 'triangle', vol: 0.06 }),
    absorb: () => tone(300, 0.25, { to: 900, type: 'sawtooth', vol: 0.05 }),
    down: () => tone(400, 0.45, { to: 100, type: 'sawtooth', vol: 0.08 }),
    revive: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.35, { type: 'triangle', vol: 0.12, delay: i * 0.07 })),
    // 허현
    cheek: () => { noise(0.1, { freq: 300, vol: 0.3 }); tone(180, 0.18, { to: 60, type: 'square', vol: 0.1 }); },
    block: () => tone(1200, 0.08, { type: 'triangle', vol: 0.08 }),
    ukka: () => { tone(110, 0.3, { type: 'sawtooth', vol: 0.08 }); tone(117, 0.3, { type: 'sawtooth', vol: 0.08 }); },
    // 박건
    domain: () => { tone(120, 0.6, { to: 240, vol: 0.12 }); noise(0.6, { freq: 600, vol: 0.05 }); },
    domainHit: info => {
      const f = 200 + (info.step || 1) * 80;
      tone(f, 0.3, { to: f / 2, type: 'square', vol: 0.06 + (info.step || 1) * 0.02 });
      noise(0.2, { freq: 500, vol: 0.2 });
    },
    // 이민규
    snotFire: () => tone(600, 0.08, { to: 200, vol: 0.15 }),
    snotHit: () => { noise(0.15, { freq: 250, vol: 0.3 }); tone(250, 0.12, { to: 120, type: 'triangle', vol: 0.12 }); },
    // 양서지
    alpha: () => { noise(0.12, { freq: 800, vol: 0.3 }); tone(330, 0.2, { to: 110, type: 'sawtooth', vol: 0.1 }); },
    // 함태준
    colosseum: () => { noise(0.8, { freq: 150, vol: 0.3 }); tone(80, 0.8, { to: 50, type: 'square', vol: 0.08 }); },
    wallHit: () => { noise(0.07, { freq: 200, vol: 0.25 }); tone(90, 0.08, { type: 'square', vol: 0.06 }); },
    tackle: () => { noise(0.1, { freq: 600, vol: 0.25 }); tone(220, 0.15, { to: 90, type: 'square', vol: 0.08 }); },
  };

  function play(name, info = {}) {
    if (!ac || muted || !SFX[name]) return;
    // 같은 소리가 한 순간에 몰려 시끄러워지지 않게 한다
    const now = ac.currentTime;
    if (last[name] && now - last[name] < 0.04) return;
    last[name] = now;
    SFX[name](info);
  }

  function toggleMute() {
    muted = !muted;
    try { localStorage.setItem('muted', muted ? '1' : '0'); } catch (e) {}
    return muted;
  }

  return { unlock, play, toggleMute, isMuted: () => muted };
})();

const IMAGES = {};
function loadImage(src) {
  if (!IMAGES[src]) {
    const img = new Image();
    img.src = src;
    IMAGES[src] = img;
  }
  return IMAGES[src];
}

// ---------- 캐릭터 ----------
// 새 캐릭터는 이 배열에 추가한다.
// 훅: init(self) / update(self, other, dt) / onContact(self, other, n)  n = self→other 방향 단위벡터
//     modifyIncoming(self, dmg, info) → 받는 피해 보정 / onLethal(self) → true면 쓰러짐을 막음
//     drawUnder(self) → 공보다 아래에 그릴 효과 (배경 영역 등)
//     onWall(self) → 자신이 벽에 닿았을 때 / onEnemyWall(self, enemy) → 상대가 벽에 닿았을 때

const COIN_TICK = 1;    // 코인 표식 피해 간격 (초)
const COIN_DAMAGE = 4;  // 코인 표식 1회 피해량
const COIN_HEAL = 1;    // 코인 표식이 피해를 줄 때마다 고준형이 회복하는 HP
const COIN_RECOVER_DELAY = 3; // 표식이 붙고 이 시간이 지나야 회수(스킬 2) 가능

const DOMAIN_IMAGE = 'images/balls/박건배경영역.jpg';
const DOMAIN_GROW_SPEED = 160; // 배경 반지름이 초당 커지는 양 (px)
const DOMAIN_STEP = 320 / 6;   // 기존 최대 피해 구간(본체 반지름 + 320px)을 7단계로 분할
const DOMAIN_DAMAGE_STEP = 6;  // 단계당 피해 (6, 12, 18, 24, 30, 36, 42)
const DOMAIN_MAX_STEPS = 7;

const COLOSSEUM_IMAGE = 'images/balls/함태준콜로세움.jpg';
const COLOSSEUM_DELAY = 3;       // 함태준: 게임 시작 3초 후부터 콜로세움 적용
const COLOSSEUM_WALL_DAMAGE = 2; // 상대가 벽에 닿을 때마다 주는 피해
const COLOSSEUM_WALL_WIDTH = 10; // 벽돌 벽 두께 (px)

const ALPHA_DAMAGE_STEP = 2;      // 양서지: 부딪힐 때마다 늘어나는 피해 (0 → 2 → 4 …)
const ALPHA_KNOCKBACK_BOOST = 2;  // 양서지 넉백: 원래 속도의 1 + 2 = 3배

const SNOT_IMAGE = 'images/balls/이민규투사체.png';
const SNOT_SPEED = SPEED['보통'];
const SNOT_RADIUS = 14;
const SNOT_DAMAGE = 14;
const SNOT_MAX_WALL_HITS = 3; // 벽에 2번 튕기고 3번째로 부딪히면 사라진다
const SLOW_DURATION = 1;      // 코딱지에 맞으면 1초 동안
const SLOW_FACTOR = 0.5;      // 원래 속도의 절반으로 느려진다

const CHARACTERS = [
  {
    name: '고준형', hp: 100, speed: '보통', size: '보통', color: '#f5c542',
    image: 'images/balls/고준형.png',
    ability: '경제론',
    skills: [
      {
        name: '호텔 경제론', cooldown: 0,
        desc: `적과 접촉 시 자신의 HP를 5 잃고 적의 HP를 5 회복시키며 적에게 ‘코인 표식’을 남긴다. 코인 표식이 붙은 적은 ${COIN_TICK}초마다 ${COIN_DAMAGE}의 피해를 받고, 그때마다 고준형은 HP를 ${COIN_HEAL} 회복한다.`,
      },
      {
        name: '결론적으로 시장에 경제가 돌았잖아요?', cooldown: 0,
        desc: `코인 표식이 붙은 지 ${COIN_RECOVER_DELAY}초가 지난 적과 접촉하면 표식을 회수하고 적의 HP를 5 흡수한다. ${COIN_RECOVER_DELAY}초가 안 됐으면 아무 일도 일어나지 않는다.`,
      },
    ],
    trait: {
      name: '불교 추천',
      desc: 'HP가 0이 되면 0.5초 후 HP 108로 단 한 번 부활하고, 모든 공격 수치가 1 증가한다.',
    },
    init(self) {
      self.atkBonus = 0;
      self.revived = false;
    },
    update(self, other, dt) {
      const mark = other.coinMark;
      if (!mark || mark.owner !== self) return;
      mark.timer += dt;
      mark.age += dt;
      while (mark.timer >= COIN_TICK && other.coinMark) {
        mark.timer -= COIN_TICK;
        const dealt = dealDamage(self, other, COIN_DAMAGE + self.atkBonus, { source: 'coinMark', sound: 'coinTick', color: '#f5c542' });
        if (dealt > 0) heal(self, COIN_HEAL);
      }
    },
    onContact(self, other, n) {
      if (other.coinMark && other.coinMark.owner === self) {

      ctx.translate(x + r * 0.82, y + r * 0.37);
      ctx.rotate(-Math.PI / 8 - (b.guitarStrum > 0 ? 40 * Math.PI / 180 : 0));
      ctx.scale(-1, 1);
      const height = r * 1.65, width = height * guitar.naturalWidth / guitar.naturalHeight;
      ctx.drawImage(guitar, -width / 2, -height / 2, width, height);
      ctx.restore();
    }
  }
  if (b.bakeryBurnFlash > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, b.bakeryBurnFlash / 0.1) * 0.65;
    ctx.fillStyle = '#ff2525';ctx.shadowColor = '#ff3420';ctx.shadowBlur = 18;
    ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  if (!b.mireun&&(b.flash > 0||b.mireunHitFlash>0)) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = b.conureFlash>0||b.mireunHitFlash>0?'rgba(255,35,45,.55)':'rgba(255, 255, 255, 0.55)';
    ctx.fill();
  }

  if (b.slow > 0) {
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(124, 207, 90, 0.35)';
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(x, y, r - 1, 0, Math.PI * 2);
  const golden = b.finisherUsed;
  ctx.strokeStyle = golden ? '#ffd700' : b.def.color;
  ctx.lineWidth = golden ? 6 : 3;
  if (golden) { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 24; }
  ctx.stroke();

  // 광대뼈 영역 표시 (스킬 준비 시 밝게)
  if (b.def.cheekAngle) {
    const a = (b.def.cheekAngle * Math.PI) / 180;
    ctx.strokeStyle = b.cd[0] <= 0 ? '#ffd0d5' : 'rgba(255, 208, 213, 0.35)';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(x, y, r + 4, -a, a); ctx.stroke();
    ctx.beginPath(); ctx.arc(x, y, r + 4, Math.PI - a, Math.PI + a); ctx.stroke();
  }
  ctx.restore();

  drawFpsGun(b,x,y,r);

  if (b.coinMark) {
    const coin = loadImage('images/balls/고준형코인표식.png');
    const cr = r * 0.42;
    const ang = elapsed * 3;
    const cx = x + Math.cos(ang) * r * 0.85;
    const cy = y + Math.sin(ang) * r * 0.85;
    if (coin.complete && coin.naturalWidth) {
      ctx.save();
      ctx.shadowColor = '#f5c542';
      ctx.shadowBlur = 12;
      ctx.drawImage(coin, cx - cr, cy - cr, cr * 2, cr * 2);
      ctx.restore();
    }
  }

  ctx.fillStyle = 'rgba(10, 12, 18, 0.75)';
  const label = `${Math.ceil(Math.max(0, b.hp))}`;
  ctx.font = `bold ${px(12)} sans-serif`;
  const w = ctx.measureText(label).width + 10;
  const h = 16 * fontScale;
  // roundRect는 구형 iOS Safari에 없어서 직접 그린다
  ctx.beginPath();
  ctx.arc(x - w / 2 + h / 2, y + r - 2, h / 2, Math.PI / 2, Math.PI * 1.5);
  ctx.arc(x + w / 2 - h / 2, y + r - 2, h / 2, -Math.PI / 2, Math.PI / 2);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(label, x, y + r - 2);
}

function drawProjectiles() {
  for (const p of projectiles) {
    if (p.stickman) {
      const age = p.walkAge || 0;
      const frame = age < 1 ? 1 : Math.floor((age - 1) / 0.5) % 2 + 1;
      const img = loadImage(`images/balls/김재윤졸라맨걸음${frame}.png`);
      if (img.complete && img.naturalWidth) {
        ctx.save(); ctx.translate(p.x, p.y);
        if (age < 1) {
          ctx.shadowColor = '#63ffae';
          ctx.shadowBlur = 15 + 12 * Math.pow(Math.sin(age * Math.PI * 4), 2);
        }
        if (p.vx < 0) ctx.scale(-1, 1);
        const height = 52, width = height * img.naturalWidth / img.naturalHeight;
        ctx.drawImage(img, -width / 2, -height / 2, width, height); ctx.restore();
      }
      continue;
    }
    if (p.label) {
      const sprite = loadImage('images/balls/문지성아쉬운플레이.png');
      if (sprite.complete && sprite.naturalWidth) {
        const width = 130;
        const height = width * sprite.naturalHeight / sprite.naturalWidth;
        ctx.drawImage(sprite, p.x - width / 2, p.y - height / 2, width, height);
        continue;
      }
      ctx.save(); ctx.font = `bold ${px(16)} sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.strokeStyle = '#15111e'; ctx.lineWidth = 4; ctx.fillStyle = p.owner.def.color;
      ctx.strokeText(p.label, p.x, p.y); ctx.fillText(p.label, p.x, p.y); ctx.restore(); continue;
    }
    if (p.emoji) {
      ctx.save(); ctx.font = `${p.r * 2}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(p.emoji, p.x, p.y); ctx.restore(); continue;
    }
    if(p.fpsBullet){
      const bullet=loadImage(p.img);
      if(bullet.complete&&bullet.naturalWidth){
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(Math.atan2(p.vy,p.vx));
        ctx.drawImage(bullet,bullet.naturalWidth*.08,bullet.naturalHeight*.36,bullet.naturalWidth*.84,bullet.naturalHeight*.28,-p.r*1.8,-p.r*.6,p.r*3.6,p.r*1.2);ctx.restore();continue;
      }
    }
    const img = loadImage(p.img);
    if (img.complete && img.naturalWidth) {
      if (p.rotateWithVelocity) {
        ctx.save(); ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx) + Math.PI / 2);
        const height = p.r * 2.6;
        const width = height * img.naturalWidth / img.naturalHeight;
        ctx.drawImage(img, -width / 2, -height / 2, width, height);
        ctx.restore();
      } else ctx.drawImage(img, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.owner.def.color;
      ctx.fill();
    }
  }
}

function drawTexts() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of texts) {
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life));
    ctx.font = `bold ${px(15)} sans-serif`;
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(10, 12, 18, 0.8)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawOverlay(title, sub, color) {
  ctx.fillStyle = 'rgba(10, 12, 18, 0.7)';
  ctx.fillRect(0, 0, SIZE, SIZE);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = color || '#e8eaf0';
  ctx.font = `bold ${px(40)} sans-serif`;
  ctx.fillText(title, SIZE / 2, SIZE / 2 - 16 * fontScale);
  ctx.fillStyle = '#8a90a2';
  ctx.font = px(18) + ' sans-serif';
  ctx.fillText(sub, SIZE / 2, SIZE / 2 + 30 * fontScale);
}

function drawKwonLaser(b) {
  if (!b.laser) return;
  const l = b.laser;
  const fade = Math.min(1, l.remaining / 0.3);
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.lineCap = 'round';
  ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 35;
  for (const [width, color] of [[30, 'rgba(255, 165, 0, 0.4)'], [15, '#ffd700'], [5, '#fffde5']]) {
    ctx.strokeStyle = color; ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.targetX, l.targetY); ctx.stroke();
  }
  const progress = 1 - l.remaining / 0.8;
  ctx.fillStyle = '#fff3ad';
  ctx.beginPath(); ctx.arc(l.targetX, l.targetY, 15 + progress * 55, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 3;
  for (let i = 0; i < 16; i++) {
    const angle = i * Math.PI * 2 / 16;
    const radius = 25 + progress * 100;
    ctx.beginPath();
    ctx.moveTo(l.targetX + Math.cos(angle) * radius, l.targetY + Math.sin(angle) * radius);
    ctx.lineTo(l.targetX + Math.cos(angle) * (radius + 18), l.targetY + Math.sin(angle) * (radius + 18)); ctx.stroke();
  }
  ctx.shadowBlur = 0;
  drawKwonGold(KWON_GOLD_FINISHER, SIZE / 2, SIZE / 2 - 100, 335, 128);
  ctx.restore();
}

function drawSuspensionLock(b) {
  if (!(b.suspension > 0) || b.hp <= 0) return;
  const radius = b.radius * 0.42;
  ctx.save();
  ctx.translate(b.x - b.radius * 0.6, b.y + b.radius * 0.6);
  ctx.fillStyle = '#342332'; ctx.strokeStyle = '#ffc1d8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, radius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.font = `${Math.round(radius * 1.5)}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🔒', 0, 0); ctx.restore();
}

function drawBuddhaRevival() {
  const img = loadImage('images/balls/고준형불교추천배경.png');
  for (const b of balls) {
    const effect = b.buddhaEffect;
    if (!effect) continue;
    const fade = effect.fade === null ? 1 : Math.max(0, effect.fade / 0.8);
    const entry = Math.min(1, effect.age / 0.12);
    ctx.save();
    ctx.globalAlpha = 0.8 * entry * fade;
    if (img.complete && img.naturalWidth) {
      const zoom = 1 + Math.max(0, 1 - effect.age / 0.5) * 0.12;
      const width = SIZE * zoom;
      ctx.drawImage(img, (SIZE - width) / 2, (SIZE - width) / 2, width, width);
    }
    ctx.globalAlpha = Math.max(0, 1 - effect.age / 0.25) * fade * 0.75;
    ctx.fillStyle = '#fff1aa'; ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.globalAlpha = fade * Math.max(0, 1 - effect.age / 0.8);
    ctx.strokeStyle = '#ffdf78'; ctx.lineWidth = 8; ctx.shadowColor = '#ffcd48'; ctx.shadowBlur = 30;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius + effect.age * 420, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}

function drawFpsUpgradeAnnouncement(){
  const notices=balls.filter(b=>b.def.name==='구동우'&&b.fpsUpgradeFlash>0&&b.fpsUpgradeShown);
  notices.forEach((b,i)=>{
    const cx=SIZE/2,cy=SIZE/2+(i-(notices.length-1)/2)*170;
    const img=loadImage('images/balls/구동우'+FPS_GEAR[b.fpsUpgradeShown]+'.png');
    const accent={computer:'#38cfff',mouse:'#bd72ff',keyboard:'#ffd35b'}[b.fpsUpgradeShown];
    ctx.save();ctx.globalAlpha=.75*Math.max(0,Math.min(1,(.95-b.fpsUpgradeFlash)/.15,b.fpsUpgradeFlash/.2));
    ctx.beginPath();ctx.moveTo(cx-174,cy-90);ctx.lineTo(cx+190,cy-90);ctx.lineTo(cx+190,cy+74);ctx.lineTo(cx+174,cy+90);ctx.lineTo(cx-190,cy+90);ctx.lineTo(cx-190,cy-74);ctx.closePath();
    ctx.fillStyle='rgba(8,18,30,.48)';ctx.fill();
    ctx.strokeStyle=accent;ctx.shadowColor=accent;ctx.shadowBlur=12;ctx.lineWidth=2;ctx.stroke();ctx.shadowBlur=0;
    ctx.save();ctx.clip();ctx.strokeStyle='rgba(180,220,255,.1)';ctx.lineWidth=1;
    for(let line=cy-90;line<cy+90;line+=6){ctx.beginPath();ctx.moveTo(cx-190,line);ctx.lineTo(cx+190,line);ctx.stroke();}ctx.restore();
    ctx.fillStyle=accent;ctx.fillRect(cx-170,cy-73,5,28);ctx.fillRect(cx+165,cy+45,5,28);
    if(img.complete&&img.naturalWidth)ctx.drawImage(img,cx-54,cy-84,108,108);
    ctx.font='bold 25px "Malgun Gothic", sans-serif';ctx.textAlign='center';ctx.fillStyle=accent;ctx.shadowColor=accent;ctx.shadowBlur=7;
    ctx.fillText('구동우 '+FPS_GEAR[b.fpsUpgradeShown]+' 강화',cx,cy+43);
    ctx.font='bold 16px "Malgun Gothic", sans-serif';ctx.fillStyle='#eafff9';ctx.shadowBlur=0;
    const description={keyboard:'연사속도 증가 및 빠른 장전',mouse:'에임봇, 탄속 증가',computer:'사거리 증가'};
    ctx.fillText(description[b.fpsUpgradeShown],cx,cy+72);ctx.restore();
  });
}
function render() {
  fontScale = Math.min(1.8, Math.max(1, SIZE / (canvas.clientWidth || SIZE)));
  const evadingReaders = balls.filter(b => b.def.name === '이지원' && isUntouchable(b) && b.hp > 0);
  const chaosStrength = Math.min(1, Math.max(0, ...evadingReaders.map(b => b.dodgeTime)) / 0.6);
  drawArena();
  if(soccerDashFade>0){
    const speedBackground=loadImage('images/balls/푸른질주배경.png');
    if(speedBackground.complete&&speedBackground.naturalWidth){ctx.save();ctx.globalAlpha=.75*soccerDashFade;ctx.drawImage(speedBackground,0,0,SIZE,SIZE);ctx.restore();}
  }
  if(electionState?.phase==='election'||electionState?.phase==='celebrate'){
    const ballot=loadImage(electionState.special?'images/balls/정찬영 출마.jpg':'images/balls/정찬영투표함.png');
    if(ballot.complete&&ballot.naturalWidth)ctx.drawImage(ballot,0,0,SIZE,SIZE);
  }
  drawBuddhaRevival();
  if (chaosStrength > 0) {
    const chaos = loadImage('images/balls/이지원회피혼돈.png');
    if (chaos.complete && chaos.naturalWidth) {
      ctx.save(); ctx.globalAlpha = chaosStrength * 0.5;
      ctx.drawImage(chaos, 0, 0, SIZE, SIZE); ctx.restore();
    }
  }
  ctx.save();
  if (chaosStrength > 0) ctx.filter = `saturate(${1 - chaosStrength * 0.9}) brightness(${1 - chaosStrength * 0.2})`;
  drawArtGround();
  drawQuakes();
  drawStudyImpacts();
  const electionOwner=electionState?.owner||electionResult?.owner;
  balls.forEach(b => {
    if((electionState?.special||electionResult?.special)&&b.def.name==='박건')return;
    if(electionOwner&&b.side!==electionOwner.side&&['구동우','문지성'].includes(b.def.name))return;
    if(b.def.drawUnder)b.def.drawUnder(b);
  });
  drawFpsMagazines();
  drawArt();
  drawAmplifiers();
  drawBakery();
  drawMusicWaves();
  drawReadingBooks();
  drawGlass();
  if(electionState?.special&&['election','celebrate'].includes(electionState.phase)){
    const box=loadImage('images/balls/전교회장투표함.png');
    const {x,y}=electionState.ballot;
    ctx.save();
    if(electionState.phase==='election'){
      ctx.strokeStyle='#ffd56a';ctx.shadowColor='#ffcf40';ctx.shadowBlur=24;ctx.lineWidth=3;
      for(let i=0;i<3;i++){const pulse=((electionState.voteAge||0)*.8+i/3)%1;ctx.globalAlpha=.7*(1-pulse);ctx.beginPath();ctx.arc(x,y,26+pulse*30,0,Math.PI*2);ctx.stroke();}
      ctx.globalAlpha=1;
    }
    if(box.complete&&box.naturalWidth)ctx.drawImage(box,x-24,y-24,48,48);ctx.restore();
  }
  balls.forEach(drawPullupEquipment);
  drawSoccerFoods();
  balls.filter(b => !evadingReaders.includes(b) && !(b.jumpTime > 0) && !b.tripAir).forEach(drawBall);
  balls.forEach(drawKick);
  balls.forEach(drawMoonOutfit);
  balls.forEach(drawArtist);
  balls.forEach(drawPerformer);
  if(electionState?.special&&['election','celebrate'].includes(electionState.phase)){
    for(const b of balls){
      const golden=electionState.phase==='celebrate'&&electionState.winner===b;
      const age=golden?2-electionState.remaining:elapsed;
      const color=golden?'#ffd54b':b.def.name==='박건'?'#4b9dff':'#59ee8c';
      ctx.save();ctx.strokeStyle=color;ctx.shadowColor=color;ctx.shadowBlur=golden?36:20;ctx.lineWidth=golden?5:3;
      for(let i=0;i<2;i++){ctx.globalAlpha=(golden?.85:.6)-i*.15;ctx.beginPath();ctx.arc(b.x,b.y,b.radius+8+i*8+Math.sin(age*8)*2,0,Math.PI*2);ctx.stroke();}
      if(golden){ctx.fillStyle='rgba(255,213,75,.22)';ctx.beginPath();ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);ctx.fill();}
      ctx.restore();
    }
  }
  for(const b of balls){if(!(b.presidentBuff>0))continue;ctx.save();ctx.strokeStyle=b.def.name==='박건'?'#b99aff':'#7dffb4';ctx.shadowColor=ctx.strokeStyle;ctx.shadowBlur=24;ctx.lineWidth=4;for(let i=0;i<2;i++){ctx.globalAlpha=.65-i*.2;ctx.beginPath();ctx.arc(b.x,b.y,b.radius+8+i*9,elapsed*(i?-1:1),elapsed*(i?-1:1)+Math.PI*1.65);ctx.stroke();}ctx.restore();}
  balls.forEach(drawExercise);
  balls.filter(b => !evadingReaders.includes(b)).forEach(drawReader);
  balls.forEach(drawSuspensionLock);
  balls.forEach(drawKwonStatus);
  drawProjectiles();
  drawSoccer();
  drawConures();

  drawTexts();
  ctx.restore();
  evadingReaders.forEach(b => { drawBall(b); drawReader(b); });
  balls.filter(b => b.jumpTime > 0 || b.tripAir).forEach(drawBall);
  drawElectionBuffTimers();
  ovens.filter(o => !o.landed).forEach(drawOvenBody);
  drawDefeatBurst();
  drawHackScene();
  drawFpsUpgradeAnnouncement();
  drawElection();
  drawMireun();


  if (state === 'ready') {
    drawOverlay('Ball Fight UKD', '탭하거나 시작 버튼을 눌러 시작');
  } else if (state === 'paused') {
    drawOverlay('일시 정지', '시작을 누르면 이어서 진행해요');
  } else if (state === 'over' && (!endSequence || endSequence.age >= 2)) {
    if (winner) drawOverlay(`${winner.def.name} 승리!`, `${elapsed.toFixed(1)}초 · 탭해서 다시 시작`, winner.def.color);
    else drawOverlay('무승부!', '탭해서 다시 시작');
  }

  balls.forEach(drawKwonLaser);

  balls.forEach((b, i) => {
    const fill = document.getElementById(`hp${i}`);
    fill.style.width = `${(Math.max(0, b.hp) / b.maxHp) * 100}%`;
    fill.style.background = b.def.color;
    const hudFilter = chaosStrength > 0 && !evadingReaders.includes(b) ? `saturate(${1 - chaosStrength * 0.9}) brightness(${1 - chaosStrength * 0.2})` : '';
    fill.style.filter = hudFilter;
    document.getElementById(`name${i}`).style.filter = hudFilter;
    document.getElementById(`name${i}`).innerHTML =
      `${b.def.name}<small>${Math.ceil(Math.max(0, b.hp))} / ${b.maxHp}</small>`;

  });
  document.getElementById('timer').textContent = `${elapsed.toFixed(1)}s`;

  const ending = endSequence && endSequence.age < 2;
  const label = ending ? '경기 종료 중…' : { ready: '시작', running: '게임 정지', paused:'시작', over: '다시 시작' }[state];
  if (startBtn.textContent !== label) startBtn.textContent = label;
  startBtn.disabled = !!ending;
  document.getElementById('stop').hidden=state!=='paused';
}

function renderCards() {
  document.getElementById('cards').innerHTML = picks.map(p => {
    const d = CHARACTERS[p];
    return `
    <div class="card">
      <h3 style="color:${d.color}">${d.image ? `<img src="${d.image}" alt="">` : '● '}${d.name}</h3>
      <dl>
        <dt>HP</dt><dd>${d.hp}</dd>
        <dt>속도</dt><dd>${d.speed}</dd>
        <dt>크기</dt><dd>${d.size}</dd>
        <dt>능력</dt><dd>${d.ability}</dd>
        <dt>스킬</dt><dd>${d.skills.map(s => `
          <p><b>${s.name}</b> <span class="cool">${s.cooldown ? `쿨타임 ${s.cooldown}초` : '조건 발동'}</span><br>${s.desc}</p>`).join('')}
        </dd>
        ${d.trait ? '<dt>특성</dt><dd><b>'+d.trait.name+'</b> — '+d.trait.desc+'</dd>' : ''}
      </dl>
    </div>`;
  }).join('');
}

// ---------- 캐릭터 선택 ----------

function setPickersEnabled(on) {
  [0, 1].forEach(i => {
    document.getElementById(`pick${i}`).disabled = !on;
    document.getElementById(`pickerToggle${i}`).disabled = !on;
    if (!on) closePicker(i);
  });
}
function closePicker(i) {
  document.getElementById(`pickerOptions${i}`).hidden = true;
  document.getElementById(`pickerToggle${i}`).setAttribute('aria-expanded', 'false');
}
function refreshPicker(i) {
  document.getElementById(`pickerToggle${i}`).textContent = CHARACTERS[picks[i]].name + ' ▾';
  document.getElementById(`pickerOptions${i}`).innerHTML = CHARACTERS.map((c,index)=>({...c,index})).sort((a,b)=>a.name.localeCompare(b.name,'ko')).map(c=>`<button type="button" data-character="${c.index}" aria-pressed="${c.index===picks[i]}">${c.name}</button>`).join('');
}

[0, 1].forEach(i => {
  const sel = document.getElementById(`pick${i}`);
  sel.innerHTML = CHARACTERS.map((c, k) => ({ name: c.name, index: k }))
    .sort((a, b) => a.name.localeCompare(b.name, 'ko'))
    .map(c => `<option value="${c.index}">${c.name}</option>`).join('');
  sel.value = picks[i];
  refreshPicker(i);
  const toggle = document.getElementById(`pickerToggle${i}`), options = document.getElementById(`pickerOptions${i}`);
  toggle.addEventListener('click', () => {
    const opening = options.hidden;
    [0,1].forEach(closePicker);
    options.hidden = !opening;
    toggle.setAttribute('aria-expanded', String(opening));
  });
  options.addEventListener('click', event => {
    const button = event.target.closest('button[data-character]');
    if (!button || sel.disabled) return;
    picks[i] = +button.dataset.character; sel.value = picks[i];
    closePicker(i); refreshPicker(i);
    state = 'ready'; reset(); renderCards(); toggle.focus();
  });
  sel.addEventListener('change', () => {
    picks[i] = +sel.value;
    refreshPicker(i);
    sel.blur();
    state = 'ready';
    reset();
    renderCards();
  });
});
document.addEventListener('click', event => { if (!event.target.closest('.character-picker')) [0,1].forEach(closePicker); });
document.addEventListener('keydown', event => { if (event.key === 'Escape') [0,1].forEach(closePicker); });

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 1 / 30);
  lastTime = now;
  if (state === 'running') update(dt);
  if(state!=='paused'){
    updateEndSequence(dt);
    updateTexts(dt);
    updateSoccerBackground(dt);
  }
  render();
  requestAnimationFrame(loop);
}

function startGame() {
  sound.unlock();
  if (state === 'running' || (endSequence && endSequence.age < 2)) return;
  const resuming=state==='paused';
  if (state === 'over') reset();
  state = 'running';
  setPickersEnabled(false);
  if(!resuming)sound.play('start');
}
function toggleGame(){
  if(state==='running'){state='paused';return;}
  startGame();
}
function stopGame(){
  if(state!=='paused')return;
  state='ready';reset();setPickersEnabled(true);
}

const muteBtn = document.getElementById('mute');
function renderMute() {
  const muted = sound.isMuted();
  muteBtn.textContent = muted ? '🔇' : '🔊';
  muteBtn.setAttribute('aria-label', muted ? '소리 켜기' : '소리 끄기');
}
muteBtn.addEventListener('click', () => {
  sound.unlock();
  sound.toggleMute();
  renderMute();
  muteBtn.blur();
});
renderMute();

const startBtn = document.getElementById('start');
startBtn.addEventListener('click', toggleGame);
document.getElementById('stop').addEventListener('click', stopGame);
canvas.addEventListener('pointerdown', startGame);
document.addEventListener('keydown', e => {
  if (e.code !== 'Space') return;
  e.preventDefault();
  toggleGame();
});

reset();
renderCards();
requestAnimationFrame(now => { lastTime = now; loop(now); });
</script>
</body>
</html>
